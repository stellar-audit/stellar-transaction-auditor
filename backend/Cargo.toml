[package]
name = "stellar-transaction-auditor-backend"
version = "0.2.0"
edition = "2021"
description = "REST API that indexes, serves, and verifies the on-chain Stellar audit log"
license = "MIT"
default-run = "stellar-transaction-auditor-backend"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "stellar-transaction-auditor-backend"
path = "src/main.rs"
